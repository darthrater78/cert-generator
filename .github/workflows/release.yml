name: Release

# One tag, and the changelog picks what ships. CHANGELOG.md's entry for the version
# carries a "#### Docker" and/or a "#### Windows EXE" section; each one present
# builds and publishes that deliverable, and at least one is required. A
# deliverable with no section is left at the version it last shipped, and the
# release notes report it as unchanged.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
    outputs:
      is_newest: ${{ steps.newest.outputs.is_newest }}
      docker: ${{ steps.components.outputs.docker }}
      exe: ${{ steps.components.outputs.exe }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag is on default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          case "$GITHUB_REF_NAME" in
            *-dev.*|*-alpha.*|*-beta.*|*-rc.*) echo "Pre-release tag: built from its branch, skipping the branch check."; exit 0 ;;
          esac
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/$DEFAULT_BRANCH"; then
            echo "Tag $GITHUB_REF_NAME is not on $DEFAULT_BRANCH."
            echo "Releases come from the default branch only."
            echo "Use a pre-release tag (e.g. v2.8.0-dev.1) for a feature-branch build."
            exit 1
          fi

      # A commit reaching the default branch proves nothing on its own about
      # whether CI passed on it -- only that it was merged (or pushed
      # directly, if branch protection ever lapses). This step is the one
      # place that checks CI's actual result before anything gets built or
      # published. Tagging right after pushing is normal and CI takes
      # minutes, so an in-progress run is waited on, not treated as a failure.
      - name: Require a passing CI run for this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          deadline=$(( $(date +%s) + 1800 ))
          while true; do
            runs=$(gh api \
              "repos/${REPO}/actions/workflows/ci.yml/runs?head_sha=${SHA}&per_page=100" \
              --jq '.workflow_runs[] | "\(.status) \(.conclusion) \(.html_url)"')

            if [ -z "$runs" ]; then
              echo "::error::CI has never run for ${SHA}, so nothing has tested this commit."
              echo "Push the branch so CI runs on it, or dispatch it by hand" >&2
              echo "(Actions -> CI -> Run workflow), then re-tag." >&2
              exit 1
            fi

            if printf '%s\n' "$runs" | awk '$2 == "success" { hit = 1 } END { exit !hit }'; then
              echo "CI passed for ${SHA}."
              break
            fi

            unfinished=$(printf '%s\n' "$runs" | awk '$1 != "completed"' | wc -l)
            if [ "$unfinished" -eq 0 ]; then
              echo "::error::CI ran for ${SHA} and did not pass. Refusing to release."
              printf '%s\n' "$runs" | sed 's/^/  /' >&2
              exit 1
            fi

            echo "CI is still running for ${SHA} (${unfinished} unfinished) -- waiting."
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::Timed out waiting for CI on ${SHA} to finish."
              exit 1
            fi
            sleep 20
          done

      - name: Verify version and release notes
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          app_version="$(python3 -c 'import re; print(re.search(r"\"(.+)\"", open("app/__init__.py").read()).group(1))')"
          project_version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          if [ "$app_version" != "$version" ] || [ "$project_version" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match app/__init__.py ($app_version) or pyproject.toml ($project_version)."
            exit 1
          fi
          python3 scripts/release_notes.py "$GITHUB_REF_NAME" --check

      - name: Decide which deliverables this release ships
        id: components
        run: |
          set -euo pipefail
          python3 scripts/release_notes.py "$GITHUB_REF_NAME" --components | tee -a "$GITHUB_OUTPUT"

      - name: Decide whether this is the newest release
        id: newest
        run: |
          set -euo pipefail
          newest="$(git tag --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)"
          if [ "$GITHUB_REF_NAME" = "$newest" ]; then
            echo "is_newest=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_newest=false" >> "$GITHUB_OUTPUT"
            echo "$GITHUB_REF_NAME is older than $newest; latest will not move."
          fi

  docker:
    needs: verify
    if: needs.verify.outputs.docker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Registries need a lowercase name; the owner may not be.
      - name: Image name
        id: image
        run: echo "name=${REGISTRY}/${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ needs.verify.outputs.is_newest }}

      # One build, pushed by digest only: no version tag points at it until the
      # smoke test and the scan below have both passed on this exact digest.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          outputs: type=image,name=${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}

      - name: Smoke test the pushed image
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: bash scripts/test-container.sh "${IMAGE}@${DIGEST}"

      # Two runs over the same digest. This one never fails: it writes SARIF
      # for the repo's Security tab.
      - name: Scan image (SARIF report)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
          version: v0.74.0
          trivy-config: trivy.yaml
          trivyignores: .trivyignore.yaml
          format: sarif
          output: trivy-results.sarif
          exit-code: '0'

      - name: Upload scan to the Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trivy-results.sarif
          category: trivy-image

      # This run is the gate: a fixable HIGH or CRITICAL stops the release
      # here, before any version tag exists. A failed gate leaves only an
      # untagged digest, which can't be pulled by version.
      - name: Scan image (gate)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
          version: v0.74.0
          skip-setup-trivy: true
          trivy-config: trivy.yaml
          trivyignores: .trivyignore.yaml
          format: table
          exit-code: '1'

      - name: Tag the tested and scanned image
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          args=()
          while IFS= read -r tag; do
            [ -n "$tag" ] && args+=(-t "$tag")
          done <<< "$TAGS"
          docker buildx imagetools create "${args[@]}" "${IMAGE}@${DIGEST}"

      - name: Attest image provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  exe:
    needs: verify
    if: needs.verify.outputs.exe == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      sha256: ${{ steps.hash.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install build dependencies
        run: python -m pip install -r requirements-desktop.txt

      - name: Build EXE
        run: python build.py

      - name: Self-test EXE
        shell: pwsh
        run: scripts/test-exe.ps1 -Exe dist/CertGenerator.exe

      - name: Checksum
        id: hash
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/CertGenerator.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  CertGenerator.exe" | Out-File -Encoding ascii -NoNewline dist/CertGenerator.exe.sha256
          "sha256=$hash" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT

      - name: Attest EXE provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/CertGenerator.exe

      - name: Upload EXE
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-exe
          path: |
            dist/CertGenerator.exe
            dist/CertGenerator.exe.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [verify, docker, exe]
    # Runs when a skipped deliverable leaves its job skipped, but never past a failure.
    if: >-
      !cancelled() && needs.verify.result == 'success'
      && (needs.docker.result == 'success' || needs.docker.result == 'skipped')
      && (needs.exe.result == 'success' || needs.exe.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.verify.outputs.exe == 'true'
        with:
          name: release-exe
          path: assets

      - name: Verify downloaded EXE matches the tested build
        if: needs.verify.outputs.exe == 'true'
        env:
          EXPECTED: ${{ needs.exe.outputs.sha256 }}
        run: |
          set -euo pipefail
          actual="$(sha256sum assets/CertGenerator.exe | cut -d' ' -f1)"
          if [ "$actual" != "$EXPECTED" ]; then
            echo "Checksum mismatch: $actual != $EXPECTED"
            exit 1
          fi

      - name: Write release notes
        env:
          IMAGE_DIGEST: ${{ needs.docker.outputs.digest }}
          EXE_SHA256: ${{ needs.exe.outputs.sha256 }}
          IS_NEWEST: ${{ needs.verify.outputs.is_newest }}
        run: |
          set -euo pipefail
          extra=()
          if [ "$IS_NEWEST" != "true" ]; then extra+=(--not-newest); fi
          if [ -n "$IMAGE_DIGEST" ]; then extra+=(--image-digest "$IMAGE_DIGEST"); fi
          if [ -n "$EXE_SHA256" ]; then extra+=(--exe-sha256 "$EXE_SHA256"); fi
          python3 scripts/release_notes.py "$GITHUB_REF_NAME" "${extra[@]}" > release-notes.md
          cat release-notes.md

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IS_NEWEST: ${{ needs.verify.outputs.is_newest }}
          HAS_EXE: ${{ needs.verify.outputs.exe }}
        run: |
          set -euo pipefail
          assets=()
          # A pre-release (v2.8.0-dev.1) is marked so, and never becomes latest.
          prerelease=()
          case "$GITHUB_REF_NAME" in
            *-dev.*|*-alpha.*|*-beta.*|*-rc.*) prerelease=(--prerelease) ;;
          esac
          # Latest is the newest release, with or without the EXE: the EXE is deprecated and
          # most releases are Docker only. The README links the last EXE build by its version.
          latest=false
          if [ "$IS_NEWEST" = "true" ] && [ "${#prerelease[@]}" -eq 0 ]; then latest=true; fi
          if [ "$HAS_EXE" = "true" ]; then
            assets=(assets/CertGenerator.exe assets/CertGenerator.exe.sha256)
          fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes-file release-notes.md --latest="$latest"
            if [ "${#assets[@]}" -gt 0 ]; then
              gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
            fi
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" \
              --notes-file release-notes.md --latest="$latest" "${prerelease[@]}" "${assets[@]}"
          fi

      - name: Verify release assets
        if: needs.verify.outputs.exe == 'true'
        run: |
          set -euo pipefail
          gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[] | "\(.name) \(.size)"' | tee assets.txt
          grep -q '^CertGenerator.exe [0-9]\{7,\}$' assets.txt
          grep -q '^CertGenerator.exe.sha256 ' assets.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
