name: Dependency review

# Fails a pull request that adds or bumps a dependency to a version with a
# known HIGH or CRITICAL advisory, before it reaches master. Advisories
# published after merge are Dependabot alerts' job.

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: dependency-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high
