name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Docs-only changes (*.md, docs/**, LICENSE) skip the build and test jobs.
  # Fail closed: if this job fails or can't tell, everything below runs.
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Decide whether anything but docs changed
        id: diff
        env:
          # pull_request: the PR's base; push: the previous tip; manual runs: none (run everything)
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: scripts/ci-changes.sh "$BASE" >> "$GITHUB_OUTPUT"

  test:
    name: test (${{ matrix.os }}, ${{ matrix.python-version }})
    needs: changes
    # A matrix job skipped at the job level reports as plain "test", never as
    # the "test (os, version)" names branch protection requires — so this job
    # always starts, and its steps skip on a docs-only change instead.
    if: ${{ !cancelled() }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported (pyproject requires-python) and the Docker image's version,
        # plus Windows for the desktop app's platform.
        include:
          - { os: ubuntu-latest, python-version: "3.10" }
          - { os: ubuntu-latest, python-version: "3.14" }
          - { os: windows-latest, python-version: "3.14" }
    steps:
      - name: Docs-only change — nothing to test
        if: needs.changes.outputs.code == 'false'
        run: echo "Only documentation changed; tests skipped."

      - if: needs.changes.outputs.code != 'false'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - if: needs.changes.outputs.code != 'false'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        if: needs.changes.outputs.code != 'false'
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        if: needs.changes.outputs.code != 'false'
        run: python -m pytest

  browser:
    name: browser tests
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install dependencies and browsers
        env:
          # --with-deps runs apt-get; a debconf prompt would otherwise hang to the timeout.
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          python -m pip install -r requirements-e2e.txt
          python -m playwright install --with-deps chromium firefox webkit

      - name: Run browser tests
        run: >
          python -m pytest -m e2e tests/e2e
          --browser chromium --browser firefox --browser webkit
          --tracing retain-on-failure --output test-results

      - name: Upload traces from failed tests
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-traces
          path: test-results
          retention-days: 7

  windows-exe:
    name: windows exe
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code != 'false') }}
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install build dependencies
        run: python -m pip install -r requirements-desktop.txt

      - name: Build EXE
        run: python build.py

      - name: Self-test EXE
        shell: pwsh
        run: scripts/test-exe.ps1 -Exe dist/CertGenerator.exe

      - name: Upload EXE
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: CertGenerator-exe
          path: |
            dist/CertGenerator.exe
            selftest-*.json
          retention-days: 7
          if-no-files-found: error

  # The Pal ships only inside the Docker image, whose build compiles it but runs
  # no tests. This builds the whole solution and runs its tests on Windows, the
  # Pal's platform (the relay crypto goes through CNG there, OpenSSL elsewhere).
  pal:
    name: pal tests
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code != 'false') }}
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Same SDK as the Dockerfile's pal stage.
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.401

      - name: Build and test
        working-directory: pal
        run: dotnet test --solution CertGeneratorPal.slnx -c Release

  docker-build:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: cert-generator:ci

      - name: Smoke test container
        run: bash scripts/test-container.sh cert-generator:ci

      # Reports only: a CVE in the base image isn't this PR's doing, so it
      # doesn't fail the check. The release workflow's scan is what blocks.
      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: cert-generator:ci
          version: v0.74.0
          trivy-config: trivy.yaml
          trivyignores: .trivyignore.yaml
          format: table
          exit-code: '0'
