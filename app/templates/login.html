<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cert Generator — Login</title>
<link rel="icon" href="/static/icon.ico" type="image/x-icon">
<script src="/static/theme-init.js?v={{ app_version }}"></script>
<link rel="stylesheet" href="/static/theme.css?v={{ app_version }}">
<link rel="stylesheet" href="/static/auth.css?v={{ app_version }}">
</head>
<body>
<canvas class="auth-guilloche" aria-hidden="true"></canvas>
<div class="auth-readout" aria-hidden="true"><pre></pre><pre></pre></div>
<main class="deed">
  <div class="deed-eyebrow">Certificate Authority · Sign-in</div>
  <h1>Cert Generator</h1>
  <div class="subtitle">Sign in to continue</div>
  <div class="deed-serial"><span data-serial></span>v{{ app_version }}</div>
  {% if error %}
  <div class="error">{{ error }}</div>
  {% endif %}
  <form method="POST" action="/login">
    <label for="username">Username</label>
    <input type="text" id="username" name="username" autocomplete="username" required autofocus>
    <label for="password">Password</label>
    <input type="password" id="password" name="password" autocomplete="current-password" required>
    <div class="checkbox-row">
      <input type="checkbox" id="trust_device" name="trust_device" value="1">
      <label for="trust_device" style="margin:0">Trust this device for 30 days</label>
    </div>
    <button type="submit">Sign In</button>
  </form>
  <canvas class="deed-seal" width="176" height="176" aria-hidden="true"></canvas>
</main>
<script src="/static/auth-bg.js?v={{ app_version }}"></script>
</body>
</html>
