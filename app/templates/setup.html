<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cert Generator — Setup</title>
<link rel="icon" href="/static/icon.ico" type="image/x-icon">
<style>
:root {
  --bg: #0f1117;
  --surface: #1a1d27;
  --border: #2a2e3e;
  --text: #e4e4e7;
  --text-dim: #8b8fa3;
  --accent: #6366f1;
  --accent-2: #8b5cf6;
  --accent-hover: #818cf8;
  --danger: #ef4444;
  --radius: 8px;
  --glow: 0 0 0 3px rgba(99,102,241,0.15);
  --ease: cubic-bezier(0.4, 0, 0.2, 1);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  background: radial-gradient(1200px circle at 50% -10%, rgba(99,102,241,0.12), transparent 60%), var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 40px;
  width: 100%;
  max-width: 380px;
  box-shadow: 0 20px 60px -15px rgba(0,0,0,0.5);
  position: relative;
  overflow: hidden;
}
.card::before {
  content: "";
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  background: linear-gradient(90deg, var(--accent), var(--accent-2));
}
h1 {
  font-size: 22px;
  font-weight: 600;
  margin-bottom: 4px;
  background: linear-gradient(135deg, var(--text), var(--accent-hover));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  display: inline-block;
}
.subtitle { font-size: 13px; color: var(--text-dim); margin-bottom: 28px; }
label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; }
input {
  width: 100%;
  padding: 10px 12px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--text);
  font-size: 14px;
  margin-bottom: 16px;
  outline: none;
  transition: border-color 0.2s var(--ease), box-shadow 0.2s var(--ease);
}
input:focus { border-color: var(--accent); box-shadow: var(--glow); }
button {
  width: 100%;
  padding: 10px;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  color: white;
  border: none;
  border-radius: var(--radius);
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  box-shadow: 0 4px 14px rgba(99,102,241,0.35);
  transition: transform 0.15s var(--ease), box-shadow 0.15s var(--ease), filter 0.15s var(--ease);
}
button:hover { filter: brightness(1.08); transform: translateY(-1px); box-shadow: 0 6px 20px rgba(99,102,241,0.45); }
button:active { transform: translateY(0); }
.error {
  background: rgba(239,68,68,0.1);
  border: 1px solid var(--danger);
  color: var(--danger);
  border-radius: var(--radius);
  padding: 10px 12px;
  font-size: 13px;
  margin-bottom: 16px;
}
.hint { font-size: 12px; color: var(--text-dim); margin-top: -10px; margin-bottom: 16px; }
</style>
</head>
<body>
<div class="card">
  <h1>Cert Generator</h1>
  <div class="subtitle">Create your admin account to get started</div>
  {% if error %}
  <div class="error">{{ error }}</div>
  {% endif %}
  <form method="POST" action="/setup">
    {% if setup_token_required %}
    <label for="setup_token">Setup Token</label>
    <input type="password" id="setup_token" name="setup_token" autocomplete="off" required>
    <div class="hint">The value of the SETUP_TOKEN environment variable</div>
    {% endif %}
    <label for="username">Username</label>
    <input type="text" id="username" name="username" autocomplete="username" required autofocus value="{{ username or '' }}">
    <label for="password">Password</label>
    <input type="password" id="password" name="password" autocomplete="new-password" required>
    <div class="hint">8 characters to 72 bytes</div>
    <label for="confirm">Confirm Password</label>
    <input type="password" id="confirm" name="confirm" autocomplete="new-password" required>
    <button type="submit">Create Account</button>
  </form>
</div>
</body>
</html>
