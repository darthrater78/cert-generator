<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cert Generator — Verify MFA</title>
<link rel="icon" href="/static/icon.ico" type="image/x-icon">
<style>
:root {
  --bg: #0f1117;
  --surface: #1a1d27;
  --border: #2a2e3e;
  --text: #e4e4e7;
  --text-dim: #8b8fa3;
  --accent: #6366f1;
  --accent-hover: #818cf8;
  --danger: #ef4444;
  --radius: 8px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 40px;
  width: 100%;
  max-width: 380px;
}
h1 { font-size: 22px; font-weight: 600; margin-bottom: 4px; }
.subtitle { font-size: 13px; color: var(--text-dim); margin-bottom: 28px; }
label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; }
input[type="text"] {
  width: 100%;
  padding: 10px 12px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--text);
  font-size: 18px;
  letter-spacing: 0.3em;
  text-align: center;
  margin-bottom: 16px;
  outline: none;
}
input[type="text"]:focus { border-color: var(--accent); }
.checkbox-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 20px;
  font-size: 13px;
  color: var(--text-dim);
}
.checkbox-row input[type="checkbox"] { width: auto; margin: 0; }
button {
  width: 100%;
  padding: 10px;
  background: var(--accent);
  color: white;
  border: none;
  border-radius: var(--radius);
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
}
button:hover { background: var(--accent-hover); }
.error {
  background: rgba(239,68,68,0.1);
  border: 1px solid var(--danger);
  color: var(--danger);
  border-radius: var(--radius);
  padding: 10px 12px;
  font-size: 13px;
  margin-bottom: 16px;
}
.footer {
  margin-top: 16px;
  text-align: center;
}
.footer a {
  font-size: 12px;
  color: var(--text-dim);
  text-decoration: none;
}
.footer a:hover { color: var(--danger); }
.footer .link-button {
  width: auto;
  margin: 0;
  padding: 0;
  background: none;
  border: none;
  font-size: 12px;
  color: var(--text-dim);
  cursor: pointer;
}
.footer .link-button:hover { color: var(--danger); background: none; }
.hint {
  font-size: 11px;
  color: var(--text-dim);
  margin: -8px 0 12px;
}
</style>
</head>
<body>
<div class="card">
  <h1>Verify Identity</h1>
  <div class="subtitle">Enter the code from your authenticator app</div>
  {% if error %}
  <div class="error">{{ error }}</div>
  {% endif %}
  <form method="POST" action="/mfa">
    <label for="code">Verification Code</label>
    <input type="text" id="code" name="code" autocomplete="one-time-code" inputmode="numeric" maxlength="6" pattern="[0-9]{6}" required autofocus placeholder="000000">
    {% if locked %}
    <label for="encryption_password">Encryption Password</label>
    <input type="password" id="encryption_password" name="encryption_password" autocomplete="off" required>
    <div class="hint">The database is locked. Your encryption password is needed to read your MFA secret, and unlocks the database.</div>
    {% endif %}
    <div class="checkbox-row">
      <input type="checkbox" id="trust_device" name="trust_device" value="1">
      <label for="trust_device" style="margin:0">Trust this device for 30 days</label>
    </div>
    <button type="submit">Verify</button>
  </form>
  <form class="footer" method="POST" action="/logout">
    <button type="submit" class="link-button">Sign out</button>
  </form>
</div>
</body>
</html>
