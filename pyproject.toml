[project]
name = "cert-generator"
version = "1.2.0"
description = "Certificate Authority tool for generating and managing self-signed certificates"
requires-python = ">=3.10"
dependencies = [
    "cryptography==44.0.3",
    "flask==3.1.1",
    "pywebview==5.3.2",
]

[project.scripts]
cert-generator = "app.main:main"
