[project]
name = "cert-generator"
version = "1.9.0"
description = "Certificate Authority tool for generating and managing self-signed certificates"
requires-python = ">=3.10"
dependencies = [
    "bcrypt==5.0.0",
    "cryptography==50.0.1",
    "flask==3.1.3",
    "pyotp==2.10.0",
    "qrcode==8.2",
    "waitress==3.0.2",
]

[project.urls]
Repository = "https://github.com/darthrater78/cert-generator"

[project.optional-dependencies]
desktop = ["pywebview==5.3.2"]

[project.scripts]
cert-generator = "app.main:main"
cert-generator-server = "app.serve:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
